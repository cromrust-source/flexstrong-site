<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexStrong Bot — Live Статистика</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        :root { --bg: #0a0a0f; --card: #12121a; --border: #1e1e30; --accent: #7c3aed; --accent2: #a78bfa; --gold: #f59e0b; --text: #e2e8f0; --text2: #94a3b8; --green: #10b981; --red: #ef4444; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; padding: 30px 0 15px; }
        .header h1 { font-size: 36px; font-weight: 800; background: linear-gradient(135deg, var(--accent2), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px; margin: 16px 0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; }
        .status-dot.online { background: var(--green); box-shadow: 0 0 12px var(--green); animation: pulse 1.5s infinite; }
        .status-dot.offline { background: var(--red); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .stats-row { display: flex; gap: 16px; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 18px; font-weight: 800; background: linear-gradient(135deg, var(--accent2), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-label { font-size: 9px; color: var(--text2); text-transform: uppercase; }
        
        /* ВКЛАДКИ */
        .tabs { display: flex; gap: 4px; margin-bottom: 0; background: var(--card); border-radius: 16px 16px 0 0; padding: 4px; border: 1px solid var(--border); border-bottom: none; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; border-radius: 12px; font-size: 13px; font-weight: 600; transition: all 0.3s; color: var(--text2); border: none; background: transparent; }
        .tab.active { background: var(--accent); color: white; }
        .tab:hover:not(.active) { color: var(--text); background: rgba(255,255,255,0.03); }
        
        .table-wrapper { background: var(--card); border: 1px solid var(--border); border-radius: 0 0 16px 16px; overflow: hidden; }
        .table-scroll { max-height: 60vh; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        thead { position: sticky; top: 0; z-index: 10; background: #0e0e16; }
        th { padding: 12px 14px; text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); border-bottom: 1px solid var(--border); }
        td { padding: 11px 14px; border-bottom: 1px solid rgba(30,30,48,0.4); font-size: 13px; }
        tbody tr:hover { background: rgba(124,58,237,0.04); }
        
        .rank { font-weight: 800; font-size: 15px; }
        .rank-1 { color: #f59e0b; }
        .rank-2 { color: #94a3b8; }
        .rank-3 { color: #cd853f; }
        .premium-badge { display: inline-block; background: linear-gradient(135deg,#f59e0b,#d97706); color:#000; font-size:9px; padding:1px 6px; border-radius:10px; margin-left:4px; }
        .diamonds { color: var(--accent2); font-weight: 600; }
        .time { color: var(--text2); font-size: 11px; }
        .green-text { color: var(--green); }
        .footer { text-align: center; padding: 20px; color: #475569; font-size: 11px; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        @media (max-width: 768px) {
            .header h1 { font-size: 24px; }
            .tabs { flex-wrap: wrap; }
            .tab { font-size: 11px; padding: 10px 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 FlexStrong Bot</h1>
        </div>
        
        <div class="status-card">
            <div style="display:flex;align-items:center;gap:10px;">
                <span class="status-dot online" id="statusDot"></span>
                <span id="statusText" style="font-weight:700;">🟢 Онлайн</span>
            </div>
            <div class="stats-row">
                <div class="stat-item"><div class="stat-value" id="totalUsers">—</div><div class="stat-label">Юзеров</div></div>
                <div class="stat-item"><div class="stat-value" id="premiumUsers">—</div><div class="stat-label">Premium</div></div>
                <div class="stat-item"><div class="stat-value" id="totalDiamonds">—</div><div class="stat-label">Алмазов</div></div>
            </div>
            <span id="updateTime" style="font-size:11px;color:var(--text2);">—</span>
        </div>
        
        <!-- ВКЛАДКИ -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('rating')">🏆 Рейтинг</button>
            <button class="tab" onclick="switchTab('spends')">💎 Траты</button>
            <button class="tab" onclick="switchTab('premium')">⭐ Premium</button>
            <button class="tab" onclick="switchTab('topspenders')">🔥 ТОП трат</button>
        </div>
        
        <div class="table-wrapper">
            <div class="table-scroll">
                <!-- Вкладка Рейтинг -->
                <div class="tab-content active" id="tab-rating">
                    <table>
                        <thead><tr><th>#</th><th>Пользователь</th><th>💎</th><th>Рейтинг</th></tr></thead>
                        <tbody id="ratingBody"><tr><td colspan="4">Загрузка...</td></tr></tbody>
                    </table>
                </div>
                
                <!-- Вкладка Траты -->
                <div class="tab-content" id="tab-spends">
                    <table>
                        <thead><tr><th>Пользователь</th><th>💎 Потрачено</th><th>Действие</th><th>Время</th></tr></thead>
                        <tbody id="spendsBody"><tr><td colspan="4">Загрузка...</td></tr></tbody>
                    </table>
                </div>
                
                <!-- Вкладка Premium -->
                <div class="tab-content" id="tab-premium">
                    <table>
                        <thead><tr><th>Пользователь</th><th>⭐ Дней</th><th>Время</th></tr></thead>
                        <tbody id="premiumBody"><tr><td colspan="3">Загрузка...</td></tr></tbody>
                    </table>
                </div>
                
                <!-- Вкладка ТОП трат -->
                <div class="tab-content" id="tab-topspenders">
                    <table>
                        <thead><tr><th>#</th><th>Пользователь</th><th>💎 Всего потрачено</th></tr></thead>
                        <tbody id="topSpendersBody"><tr><td colspan="3">Загрузка...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div class="footer">FlexStrong Bot © 2026</div>
    </div>
    
    <script>
        const DATA_URL = 'site_data.json';
        const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
        
        function switchTab(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${name}')"]`).classList.add('active');
            document.getElementById('tab-' + name).classList.add('active');
        }
        
        function formatNumber(num) {
            if (num >= 1000000) return (num/1000000).toFixed(1)+'M';
            if (num >= 1000) return (num/1000).toFixed(1)+'K';
            return num.toString();
        }
        
        async function loadData() {
            try {
                const res = await fetch(DATA_URL + '?t=' + Date.now());
                const data = await res.json();
                
                document.getElementById('totalUsers').textContent = formatNumber(data.stats.total_users);
                document.getElementById('premiumUsers').textContent = formatNumber(data.stats.premium_users);
                document.getElementById('totalDiamonds').textContent = formatNumber(data.stats.total_diamonds);
                document.getElementById('updateTime').textContent = data.timestamp || '—';
                
                // Рейтинг
                let html = '';
                data.top.forEach(user => {
                    const medal = medals[user.position] || user.position + '.';
                    let rankClass = user.position <= 3 ? ' rank-' + user.position : '';
                    const premiumBadge = user.is_premium ? ' <span class="premium-badge">👑</span>' : '';
                    html += `<tr>
                        <td><span class="rank${rankClass}">${medal}</span></td>
                        <td>${user.name}${premiumBadge}</td>
                        <td><span class="diamonds">💎${user.diamonds}</span></td>
                        <td><strong>${user.rating.toLocaleString()}</strong></td>
                    </tr>`;
                });
                document.getElementById('ratingBody').innerHTML = html || '<tr><td colspan="4">Нет данных</td></tr>';
                
                // Траты
                html = '';
                (data.recent_spends || []).forEach(s => {
                    html += `<tr>
                        <td>${s.name}</td>
                        <td><span class="diamonds">-${s.amount}💎</span></td>
                        <td>${s.action}</td>
                        <td class="time">${s.time}</td>
                    </tr>`;
                });
                document.getElementById('spendsBody').innerHTML = html || '<tr><td colspan="4">Нет трат</td></tr>';
                
                // Premium покупки
                html = '';
                (data.recent_premium || []).forEach(p => {
                    html += `<tr>
                        <td>${p.name} <span class="premium-badge">⭐</span></td>
                        <td class="green-text">+${p.days} дн.</td>
                        <td class="time">${p.time}</td>
                    </tr>`;
                });
                document.getElementById('premiumBody').innerHTML = html || '<tr><td colspan="3">Нет покупок</td></tr>';
                
                // ТОП трат
                html = '';
                (data.top_spenders || []).forEach((s, i) => {
                    const medal = medals[i+1] || (i+1) + '.';
                    html += `<tr>
                        <td><strong>${medal}</strong></td>
                        <td>${s.name}</td>
                        <td><span class="diamonds">💎${s.total_spent}</span></td>
                    </tr>`;
                });
                document.getElementById('topSpendersBody').innerHTML = html || '<tr><td colspan="3">Нет данных</td></tr>';
                
            } catch (e) {
                console.error(e);
            }
        }
        
        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
